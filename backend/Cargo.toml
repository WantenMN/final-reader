[package]
name = "final-reader"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.5", features = ["cors"] }
sqlx = { version = "0.8.6", features = ["chrono", "runtime-tokio-native-tls", "sqlite", "uuid"] }
directories = "6.0.0"
epub = "2.1.5"
futures-util = "0.3.31"
mime = "0.3.17"
mime_guess = "2.0.5"
regex = "1.10.4"

